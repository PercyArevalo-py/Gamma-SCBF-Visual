name: SCBF09 Typst Golden Candidate

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  compile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install pinned Typst 0.15.1
        shell: bash
        run: |
          set -euo pipefail
          curl -fsSL -o typst.tar.xz https://github.com/typst/typst/releases/download/v0.15.1/typst-x86_64-unknown-linux-musl.tar.xz
          tar -xJf typst.tar.xz
          sudo install -m 0755 typst-x86_64-unknown-linux-musl/typst /usr/local/bin/typst
          typst --version
          test "$(typst --version | awk '{print $2}')" = "0.15.1"
      - name: Compile SCBF09
        run: |
          mkdir -p qa
          typst compile report/main.typ qa/SCBF09_GOLDEN_CANDIDATE.pdf
          sha256sum qa/SCBF09_GOLDEN_CANDIDATE.pdf | tee qa/SCBF09_GOLDEN_CANDIDATE.sha256
      - name: Upload Golden candidate
        uses: actions/upload-artifact@v4
        with:
          name: SCBF09-Golden-Candidate
          path: |
            qa/SCBF09_GOLDEN_CANDIDATE.pdf
            qa/SCBF09_GOLDEN_CANDIDATE.sha256
          if-no-files-found: error
